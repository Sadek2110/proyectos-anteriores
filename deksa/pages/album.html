  <style>
    :root {
      --yellow:       #F5C842;
      --yellow-light: #FDE88A;
      --yellow-dark:  #D4A820;
      --pink:         #F2708A;
      --pink-light:   #FAB0C0;
      --pink-dark:    #C94E68;
      --cream:        #FFF8ED;
      --ink:          #2A1A1F;
      --ink-soft:     #6B4A55;
      --white:        #FFFFFF;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
      --transition:   .35s cubic-bezier(.4,0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--ink);
      overflow-x: hidden;
    }

    /* NAV */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,248,237,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(245,200,66,.25);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav__back {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .9rem;
      font-weight: 500;
      color: var(--pink-dark);
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }
    .nav__back:hover { transform: translateX(-4px); color: var(--pink); }
    .nav__title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-style: italic;
      color: var(--ink);
    }
    .nav__emoji { font-size: 1.4rem; }

    /* HERO ALBUM */
    .album-hero {
      background: linear-gradient(135deg, var(--yellow) 0%, var(--pink) 100%);
      padding: 5rem 2rem 4rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .album-hero::before {
      content: '📸';
      position: absolute;
      font-size: 20rem;
      opacity: .05;
      top: -4rem;
      right: -4rem;
      transform: rotate(15deg);
      pointer-events: none;
    }
    .album-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 7vw, 5rem);
      color: var(--white);
      text-shadow: 0 4px 24px rgba(42,26,31,.2);
      margin-bottom: .6rem;
    }
    .album-hero h1 em {
      display: block;
      font-style: italic;
      font-weight: 400;
    }
    .album-hero p {
      color: rgba(255,255,255,.85);
      font-size: 1.1rem;
      font-weight: 300;
      max-width: 500px;
      margin: 0 auto;
    }

    /* DAYS TIMELINE */
    .timeline {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    .day-block {
      margin-bottom: 5rem;
      animation: fadeUp .6s ease both;
    }

    /* Day header */
    .day-header {
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
      margin-bottom: 2rem;
      position: relative;
    }
    .day-header::after {
      content: '';
      position: absolute;
      left: 3.2rem;
      top: 100%;
      width: 1px;
      height: 2rem;
      background: linear-gradient(to bottom, var(--pink-light), transparent);
    }
    .day-number {
      flex-shrink: 0;
      width: 4.5rem;
      height: 4.5rem;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--white);
      box-shadow: 0 8px 24px rgba(242,112,138,.35);
      flex-direction: column;
      line-height: 1;
    }
    .day-number span {
      font-size: .55rem;
      font-family: var(--font-body);
      font-weight: 400;
      letter-spacing: .05em;
      opacity: .8;
      margin-top: .1rem;
    }
    .day-info h2 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }
    .day-info .day-date {
      font-size: .85rem;
      color: var(--pink);
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .3rem;
    }
    .day-info p {
      color: var(--ink-soft);
      font-size: .95rem;
      font-weight: 300;
      line-height: 1.7;
      margin-top: .4rem;
      max-width: 520px;
    }

    /* PHOTO GRID */
    .photo-grid {
      display: grid;
      gap: .75rem;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }

    /* Featured first item */
    .photo-grid.has-featured .media-item:first-child {
      grid-column: span 2;
      grid-row: span 2;
    }

    .media-item {
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--yellow-light), var(--pink-light));
      aspect-ratio: 1;
      position: relative;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(42,26,31,.08);
    }
    .media-item:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 36px rgba(242,112,138,.25);
      z-index: 2;
    }
    .media-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: var(--transition);
    }
    .media-item:hover img { transform: scale(1.05); }

    /* Video item */
    .media-item.is-video {
      background: linear-gradient(135deg, var(--ink), #4A2A35);
    }
    .media-item.is-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(42,26,31,.35);
      transition: var(--transition);
    }
    .media-item.is-video:hover .video-overlay { background: rgba(42,26,31,.15); }
    .play-btn {
      width: 52px;
      height: 52px;
      background: rgba(255,255,255,.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
      transition: var(--transition);
    }
    .media-item.is-video:hover .play-btn { transform: scale(1.15); background: var(--yellow); }

    /* Placeholder items */
    .media-item.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: .4rem;
      border: 2px dashed rgba(242,112,138,.3);
      background: rgba(255,255,255,.6);
      cursor: default;
    }
    .placeholder-icon { font-size: 2rem; opacity: .4; }
    .placeholder-text { font-size: .7rem; color: var(--ink-soft); opacity: .6; text-align: center; padding: 0 .5rem; }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(42,26,31,.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
      padding: 1.5rem;
    }
    .lightbox.is-open {
      opacity: 1;
      pointer-events: all;
    }
    .lightbox__close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      width: 42px;
      height: 42px;
      background: rgba(255,255,255,.12);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox__close:hover { background: var(--pink); }
    .lightbox__media {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
      animation: zoomIn .3s ease both;
    }
    .lightbox__nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.12);
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      color: white;
      font-size: 1.4rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox__nav:hover { background: var(--pink); }
    .lightbox__prev { left: 1rem; }
    .lightbox__next { right: 1rem; }

    /* INSTRUCTIONS BOX */
    .instructions {
      background: linear-gradient(135deg, rgba(245,200,66,.12), rgba(242,112,138,.12));
      border: 1px dashed rgba(245,200,66,.5);
      border-radius: 16px;
      padding: 1.5rem 2rem;
      margin-bottom: 3rem;
      font-size: .88rem;
      color: var(--ink-soft);
      line-height: 1.7;
    }
    .instructions strong { color: var(--pink-dark); }
    .instructions code {
      background: rgba(242,112,138,.1);
      padding: .15rem .4rem;
      border-radius: 4px;
      font-size: .82rem;
      color: var(--pink-dark);
      font-family: monospace;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 640px) {
      .photo-grid.has-featured .media-item:first-child {
        grid-column: span 1;
        grid-row: span 1;
      }
      .day-header { gap: 1rem; }
      .day-number { width: 3.5rem; height: 3.5rem; font-size: 1.1rem; }
    }
  </style>

    /* ═══════════════════════════════════════════════════════════ */

    // Estado lightbox
    let lbItems = [];
    let lbIndex = 0;

    function renderDays() {
      const container = document.getElementById('days-container');
      container.innerHTML = '';

      DAYS.forEach((day, di) => {
        const block = document.createElement('div');
        block.className = 'day-block';
        block.style.animationDelay = `${di * 0.1}s`;

        const hasMedia = day.media && day.media.length > 0;
        const gridClass = hasMedia && day.media.length >= 3 ? 'photo-grid has-featured' : 'photo-grid';

        // Construir items de media o placeholders
        let mediaHTML = '';
        if (hasMedia) {
          day.media.forEach((item, idx) => {
            const globalIdx = `${di}-${idx}`;
            if (item.type === 'video') {
              mediaHTML += `
                <div class="media-item is-video" onclick="openLightboxVideo('${item.src}', ${di})">
                  <video src="${item.src}" muted preload="metadata"></video>
                  <div class="video-overlay">
                    <div class="play-btn">▶</div>
                  </div>
                </div>`;
            } else {
              mediaHTML += `
                <div class="media-item" onclick="openLightboxImg(${di}, ${idx})">
                  <img src="${item.src}" alt="Foto del día ${day.number}" loading="lazy" />
                </div>`;
            }
          });
        } else {
          // Placeholders cuando no hay fotos aún
          for (let p = 0; p < 4; p++) {
            mediaHTML += `
              <div class="media-item placeholder">
                <span class="placeholder-icon">${p === 0 ? '📷' : p === 1 ? '🎞️' : p === 2 ? '🖼️' : '✨'}</span>
                <span class="placeholder-text">Añade tu foto aquí</span>
              </div>`;
          }
        }

        block.innerHTML = `
          <div class="day-header">
            <div class="day-number">${day.number}<span>DÍA</span></div>
            <div class="day-info">
              <div class="day-date">${day.date}</div>
              <h2>${day.title}</h2>
              <p>${day.desc}</p>
            </div>
          </div>
          <div class="${gridClass}">${mediaHTML}</div>
        `;
        container.appendChild(block);
      });
    }

    function openLightboxImg(dayIdx, mediaIdx) {
      const day = DAYS[dayIdx];
      lbItems = day.media.filter(m => m.type === 'img');
      lbIndex = day.media.slice(0, mediaIdx).filter(m => m.type === 'img').length;
      showLightboxItem();
    }

    function openLightboxVideo(src) {
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      const vid = document.getElementById('lightbox-video');
      img.style.display = 'none';
      vid.style.display = 'block';
      vid.src = src;
      vid.play();
      lb.classList.add('is-open');
      lbItems = [];
    }

    function showLightboxItem() {
      const item = lbItems[lbIndex];
      if (!item) return;
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      const vid = document.getElementById('lightbox-video');
      img.style.display = 'block';
      vid.style.display = 'none';
      vid.pause();
      img.src = item.src;
      lb.classList.add('is-open');
    }

    function lightboxNav(dir) {
      if (!lbItems.length) return;
      lbIndex = (lbIndex + dir + lbItems.length) % lbItems.length;
      showLightboxItem();
    }

    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      const vid = document.getElementById('lightbox-video');
      lb.classList.remove('is-open');
      vid.pause();
      vid.src = '';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') lightboxNav(1);
      if (e.key === 'ArrowLeft') lightboxNav(-1);
    });

    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeLightbox();
    });

    renderDays();
  </script>
