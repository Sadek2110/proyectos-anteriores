<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuestionario — Elementos de un jardín</title>
<style>
  :root {
    --bg: #f5f1ea;
    --card: #ffffff;
    --primary: #2f6b3a;
    --primary-dark: #224f2b;
    --accent: #c68a3a;
    --text: #2a2a2a;
    --muted: #6b6b6b;
    --correct: #2f6b3a;
    --wrong: #b53a3a;
    --border: #e2dccf;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem 1rem;
    line-height: 1.6;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 2rem;
  }
  header h1 {
    color: var(--primary-dark);
    font-size: 2rem;
    margin: 0 0 .3rem;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 1rem;
  }
  .progress-bar {
    background: var(--border);
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    margin: 1.5rem 0 2rem;
  }
  .progress-fill {
    background: var(--primary);
    height: 100%;
    width: 0%;
    transition: width .3s ease;
  }
  .question {
    background: var(--card);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1.2rem;
    border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.04);
  }
  .question-number {
    color: var(--accent);
    font-weight: 700;
    font-size: .85rem;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    margin: .3rem 0 1rem;
    color: var(--primary-dark);
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: .6rem;
    padding: .7rem .9rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s ease;
    background: #fafaf7;
  }
  .option:hover {
    border-color: var(--primary);
    background: #f0f6f1;
  }
  .option input {
    margin-top: .3rem;
    accent-color: var(--primary);
    cursor: pointer;
  }
  .option.selected {
    border-color: var(--primary);
    background: #e8f1ea;
  }
  .option.correct {
    border-color: var(--correct);
    background: #e3f0e5;
  }
  .option.wrong {
    border-color: var(--wrong);
    background: #f7e3e3;
  }
  .feedback {
    margin-top: .8rem;
    padding: .7rem .9rem;
    border-radius: 6px;
    font-size: .92rem;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct {
    background: #e3f0e5;
    color: var(--correct);
    border-left: 3px solid var(--correct);
  }
  .feedback.wrong {
    background: #f7e3e3;
    color: var(--wrong);
    border-left: 3px solid var(--wrong);
  }
  .actions {
    text-align: center;
    margin: 2rem 0;
  }
  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: .9rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease;
  }
  button:hover { background: var(--primary-dark); }
  button.secondary {
    background: var(--accent);
    margin-left: .5rem;
  }
  button.secondary:hover { background: #a87328; }
  .results {
    background: var(--card);
    border: 2px solid var(--primary);
    border-radius: 12px;
    padding: 2rem;
    text-align: center;
    margin-top: 2rem;
    display: none;
  }
  .results.show { display: block; }
  .score {
    font-size: 3rem;
    font-weight: 700;
    color: var(--primary-dark);
    margin: .5rem 0;
  }
  .score-label {
    color: var(--muted);
    font-size: 1rem;
  }
  .grade-message {
    font-size: 1.2rem;
    margin: 1rem 0;
    font-weight: 600;
  }
  @media (max-width: 600px) {
    body { padding: 1rem .5rem; }
    header h1 { font-size: 1.5rem; }
    .question { padding: 1.1rem; }
    button { width: 100%; margin: .3rem 0 !important; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🌳 Elementos de un jardín</h1>
    <p>Cuestionario de 20 preguntas · AGAO0208 — Jardinería</p>
  </header>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <form id="quizForm"></form>

  <div class="actions">
    <button type="button" onclick="checkAnswers()">Ver puntuación final</button>
    <button type="button" class="secondary" onclick="resetQuiz()">Reiniciar</button>
  </div>

  <div class="results" id="results">
    <div class="score-label">Tu puntuación</div>
    <div class="score" id="scoreDisplay">0 / 20</div>
    <div class="grade-message" id="gradeMessage"></div>
    <p style="color:var(--muted);">Revisa las respuestas marcadas arriba para ver la corrección detallada.</p>
  </div>
</div>

<script>
const questions = [
  {
    q: "Los elementos de un jardín se pueden separar lógicamente en dos grandes grupos. ¿Cuáles son?",
    options: [
      "Elementos naturales y elementos artificiales",
      "Elementos vegetales y elementos no vegetales",
      "Elementos simples y composiciones",
      "Elementos ornamentales y elementos funcionales"
    ],
    correct: 1,
    explain: "Los elementos del jardín se dividen en plantas (elementos vegetales) y todos los demás (elementos no vegetales): construcciones, obras de arte, mobiliario, etc."
  },
  {
    q: "En jardinería, ¿qué elementos son considerados la esencia y los constituyentes básicos del jardín?",
    options: [
      "Las edificaciones y obras civiles",
      "El mobiliario y la ornamentación",
      "Los elementos vegetales",
      "Las instalaciones hidráulicas"
    ],
    correct: 2,
    explain: "En jardinería los elementos vegetales son realmente la esencia; todos los demás están a su servicio."
  },
  {
    q: "¿Cómo se clasifican los elementos vegetales?",
    options: [
      "En anuales y perennes",
      "En leñosos y herbáceos",
      "En autóctonos y exóticos",
      "En elementos simples y composiciones"
    ],
    correct: 3,
    explain: "Los elementos vegetales se clasifican en elementos simples (árbol, arbusto, mata, planta de flor, pradera) y composiciones (setos, borduras, alineaciones, etc.)."
  },
  {
    q: "Un vegetal superior, perenne y leñoso, con un tronco claramente diferenciado, es la definición de:",
    options: [
      "Arbusto",
      "Árbol",
      "Mata",
      "Ejemplar"
    ],
    correct: 1,
    explain: "El árbol se define por su tronco claramente diferenciado, además de ser perenne y leñoso."
  },
  {
    q: "Un vegetal superior, perenne y leñoso, sin tronco o con varios troncos diferenciados, es:",
    options: [
      "Árbol",
      "Pradera",
      "Arbusto",
      "Seto"
    ],
    correct: 2,
    explain: "El arbusto se distingue del árbol precisamente por no tener tronco único diferenciado."
  },
  {
    q: "¿Cuál de los siguientes NO es un elemento vegetal simple?",
    options: [
      "Mata",
      "Planta de flor",
      "Pradera",
      "Bosquete"
    ],
    correct: 3,
    explain: "El bosquete es una composición (conjunto numeroso de árboles del mismo tipo), no un elemento simple."
  },
  {
    q: "Una línea de vegetación continua, formada por árboles o arbustos plantados muy juntos, que sirve de delimitación, es:",
    options: [
      "Una alineación",
      "Un seto",
      "Un macizo",
      "Una bordura"
    ],
    correct: 1,
    explain: "El seto es una línea CONTINUA de vegetación. La clave es 'plantados muy juntos' y 'delimitación'."
  },
  {
    q: "Un seto formado por matas o arbustos de pequeña talla, o muy recortados, se denomina:",
    options: [
      "Cerramiento",
      "Pantalla",
      "Bordura",
      "Macizo"
    ],
    correct: 2,
    explain: "La bordura es un tipo de seto bajo, formado por matas o arbustos pequeños o muy recortados."
  },
  {
    q: "Un seto a base de especies de vegetación muy densa o espinosas, con finalidad defensiva, recibe el nombre de:",
    options: [
      "Cerramiento",
      "Bordura",
      "Alineación",
      "Pantalla"
    ],
    correct: 0,
    explain: "El cerramiento es un seto defensivo de vegetación densa o espinosa."
  },
  {
    q: "Una línea de vegetación DISCONTINUA, con árboles o arbustos plantados lo suficientemente separados para que se aprecie su individualidad, es:",
    options: [
      "Un seto",
      "Una alineación",
      "Un grupo",
      "Un bosquete"
    ],
    correct: 1,
    explain: "La alineación se diferencia del seto en que es DISCONTINUA: se aprecia la individualidad de cada pie."
  },
  {
    q: "Los pies arbustivos o arbóreos plantados aisladamente y que presentan características especiales que los destacan se denominan:",
    options: [
      "Grupos",
      "Macizos",
      "Ejemplares",
      "Bosquetes"
    ],
    correct: 2,
    explain: "El ejemplar es un pie aislado destacado por sus características especiales (porte, edad, rareza, etc.)."
  },
  {
    q: "Un conjunto POCO numeroso de árboles o arbustos del mismo tipo es:",
    options: [
      "Un bosquete",
      "Un macizo",
      "Una pantalla",
      "Un grupo"
    ],
    correct: 3,
    explain: "El grupo es poco numeroso; cuando hablamos de un conjunto numeroso de árboles del mismo tipo es un bosquete."
  },
  {
    q: "Los conjuntos de arbustos, matas o plantas de flor, NUMEROSOS y que a veces ocupan grandes superficies, también llamados 'masas', son:",
    options: [
      "Bosquetes",
      "Macizos",
      "Borduras",
      "Rocallas"
    ],
    correct: 1,
    explain: "Los macizos (también llamados 'masas') son conjuntos numerosos que pueden ocupar grandes superficies."
  },
  {
    q: "Conjuntos numerosos de árboles del mismo tipo son:",
    options: [
      "Grupos",
      "Macizos",
      "Bosquetes",
      "Alineaciones"
    ],
    correct: 2,
    explain: "El bosquete se diferencia del grupo en que es numeroso, y del macizo en que está formado por árboles (no arbustos/matas)."
  },
  {
    q: "Los bosquetes cuya finalidad es proteger del viento o cortar la visibilidad se llaman:",
    options: [
      "Cerramientos",
      "Pantallas",
      "Setos",
      "Cortinas"
    ],
    correct: 1,
    explain: "La pantalla es un bosquete con función protectora (viento) o de cortar la visibilidad."
  },
  {
    q: "Una masa abigarrada formada por arbustos, matas y plantas de flor variadas, colocadas entre rocas y piedras, casi siempre en áreas ataluzadas, es:",
    options: [
      "Una jardinera",
      "Un mixed border",
      "Una rocalla",
      "Una masa tapizante"
    ],
    correct: 2,
    explain: "La rocalla combina vegetación variada con rocas y piedras, típicamente en áreas con pendiente (ataluzadas)."
  },
  {
    q: "Las masas formadas por arbustos, matas o plantas de flor de vegetación RASTRERA son:",
    options: [
      "Masas tapizantes",
      "Borduras",
      "Praderas",
      "Mixed border"
    ],
    correct: 0,
    explain: "El rasgo clave de las masas tapizantes es su carácter rastrero (vegetación que cubre el suelo)."
  },
  {
    q: "El 'mixed border', típico del paisajismo inglés, es:",
    options: [
      "Un seto recortado de especies mixtas",
      "Una composición de grandes dimensiones a base de gran número de especies de flor, en masa continua, a lo largo de un borde",
      "Un macizo de arbustos colocado en el límite del jardín",
      "Una alineación de árboles frutales"
    ],
    correct: 1,
    explain: "El mixed border es una composición grande de flores variadas en masa continua a lo largo de un borde, característica del paisajismo inglés."
  },
  {
    q: "Una composición especial a base de especies arbóreas frutales (frecuentemente cítricos) plantadas en macetones o contenedores portátiles se llama:",
    options: [
      "Huerto",
      "Bosquete frutal",
      "Orangerie",
      "Jardinera"
    ],
    correct: 2,
    explain: "La 'orangerie' destaca por dos rasgos: cítricos (u otros frutales) y plantación en macetones portátiles."
  },
  {
    q: "¿Cuál de los siguientes elementos NO se considera mobiliario de jardín según el texto?",
    options: [
      "Bancos y papeleras",
      "Fuentes de agua potable",
      "Pérgolas y cenadores",
      "Señalización, mapas y letreros"
    ],
    correct: 2,
    explain: "Pérgolas y cenadores son edificaciones, no mobiliario. El mobiliario incluye bancos, papeleras, ceniceros, fuentes de agua potable, señalización, etc."
  }
];

const form = document.getElementById('quizForm');
const progressFill = document.getElementById('progressFill');

function renderQuiz() {
  form.innerHTML = '';
  questions.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'question';
    div.id = `q${i}`;
    div.innerHTML = `
      <div class="question-number">Pregunta ${i + 1} de ${questions.length}</div>
      <div class="question-text">${item.q}</div>
      <div class="options">
        ${item.options.map((opt, j) => `
          <label class="option" data-index="${j}">
            <input type="radio" name="q${i}" value="${j}">
            <span>${opt}</span>
          </label>
        `).join('')}
      </div>
      <div class="feedback" id="fb${i}"></div>
    `;
    form.appendChild(div);
  });

  // Validación inmediata al seleccionar respuesta
  form.querySelectorAll('input[type=radio]').forEach(input => {
    input.addEventListener('change', e => {
      const qIndex = parseInt(e.target.name.replace('q', ''));
      const item = questions[qIndex];
      const qBlock = document.getElementById(`q${qIndex}`);
      const options = qBlock.querySelectorAll('.option');
      const feedback = document.getElementById(`fb${qIndex}`);
      const userAnswer = parseInt(e.target.value);

      // Bloquear más cambios en esta pregunta
      qBlock.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);
      options.forEach(o => {
        o.classList.remove('selected');
        o.style.cursor = 'default';
      });

      // Marcar correcta siempre
      options[item.correct].classList.add('correct');

      // Marcar incorrecta si falló
      if (userAnswer === item.correct) {
        feedback.className = 'feedback correct show';
        feedback.innerHTML = `✓ <strong>Correcto.</strong> ${item.explain}`;
      } else {
        options[userAnswer].classList.add('wrong');
        feedback.className = 'feedback wrong show';
        feedback.innerHTML = `✗ <strong>Incorrecto.</strong> ${item.explain}`;
      }

      updateProgress();
    });
  });
}

function updateProgress() {
  const answered = form.querySelectorAll('input[type=radio]:checked').length;
  progressFill.style.width = `${(answered / questions.length) * 100}%`;
}

function checkAnswers() {
  let score = 0;
  let unanswered = 0;

  questions.forEach((item, i) => {
    const selected = form.querySelector(`input[name="q${i}"]:checked`);
    if (!selected) {
      unanswered++;
      const feedback = document.getElementById(`fb${i}`);
      const qBlock = document.getElementById(`q${i}`);
      qBlock.querySelectorAll('.option')[item.correct].classList.add('correct');
      qBlock.querySelectorAll('input[type=radio]').forEach(r => r.disabled = true);
      feedback.className = 'feedback wrong show';
      feedback.innerHTML = `⚠ <strong>Sin responder.</strong> ${item.explain}`;
    } else if (parseInt(selected.value) === item.correct) {
      score++;
    }
  });

  const results = document.getElementById('results');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const gradeMessage = document.getElementById('gradeMessage');
  const percentage = (score / questions.length) * 100;

  scoreDisplay.textContent = `${score} / ${questions.length}`;

  let message, color;
  if (percentage >= 90) { message = '🏆 ¡Excelente! Dominas la materia.'; color = '#2f6b3a'; }
  else if (percentage >= 75) { message = '👍 Muy bien. Buen conocimiento del tema.'; color = '#2f6b3a'; }
  else if (percentage >= 50) { message = '📚 Aprobado. Repasa los conceptos fallados.'; color = '#c68a3a'; }
  else { message = '📖 Necesitas repasar. Vuelve a leer el material.'; color = '#b53a3a'; }

  gradeMessage.textContent = message;
  gradeMessage.style.color = color;
  results.classList.add('show');
  results.scrollIntoView({ behavior: 'smooth' });
}

function resetQuiz() {
  renderQuiz();
  document.getElementById('results').classList.remove('show');
  progressFill.style.width = '0%';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
</body>
</html>
