<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrella Fugaz Tours</title>
    <link rel="shortcut icon" href="/favicon/favicon-16x16.png" type="image/x-icon">
</head>
<body>
    <header>
        <img src="fotos/logo.jpg" alt="Logo" width="100px">
        <nav>
            <ul>
                <li><a href="landingPage.html">Home</a></li>
                <li><a href="about.html">Sobre Nosotros</a></li>
                <li><a href="galeria.html">Fotos</a></li>
                <li><a href="contact.html">Contactanos</a></li>
                <li><a href="citasTour.html">Reservar Tour</a></li>
            </ul>
        </nav>
        <a href="login.html"><button>Iniciar Sesión</button></a>
    </header>
    <main>
        <h1>Contáctanos</h1>

        <form action="/enviar-mensaje" method="post">
            <fieldset>
                <legend>Envíanos un Mensaje</legend>

                <p>
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </p>

                <p>
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" required>
                </p>

                <p>
                    <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
                </p>

            </fieldset><br>
            <input type="submit" value="Enviar Mensaje">
        </form>
    </main>
</body>
</html>
