server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /visualizacion/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /visualizacion {
        return 301 /visualizacion/;
    }

    location /img/ {
        try_files $uri $uri/ =404;
    }

    location /pdf/ {
        try_files $uri =404;
    }

    location /presentacion/ {
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
